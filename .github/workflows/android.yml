name: Android CI and Release

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alitas-crawler-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk ALITAS-Crawler-v0.1.0-debug.apk

      - name: Create v0.1.0 pre-release if absent
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "Release v0.1.0 already exists"
          else
            gh release create v0.1.0 ALITAS-Crawler-v0.1.0-debug.apk               --target main               --title "АЛИТАС Кроулер v0.1.0"               --prerelease               --notes "Первая нативная Android-версия на Kotlin. Включает интерфейс оператора, mock-телеметрию и заготовку native BLE. Реальный протокол кроулера ещё не подключён."
          fi
