name: Android CI and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: litas-crawler-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk LITAS-Crawler-v0.2.0-debug.apk

      - name: Create v0.2.0 pre-release if absent
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo "Release v0.2.0 already exists"
          else
            gh release create v0.2.0 LITAS-Crawler-v0.2.0-debug.apk \
              --target main \
              --title "ЛИТАС Кроулер v0.2.0" \
              --prerelease \
              --notes "Версия 0.2.0: экран поиска BLE-кроулеров, native BLE scan, подключение, 5-значный PIN, защищённое хранение PIN-верификатора через Android Keystore, блокировка после 3 неверных попыток, автоматическое переподключение и симуляция потери связи."
          fi
